# STUN 端口直接拒绝 —— 对齐 QX 的 udp_drop_list = STUN。
# 小火箭没有"丢弃 STUN 包"的开关, 只能按端口拦。域名规则(下面那批)只能覆盖列出来的
# 那几家 STUN 服务器, 网站自建 STUN 就漏了; 按端口拦不依赖域名, 才是能兜住的那层。
# 3478/3479 = STUN/TURN 标准端口, 5349/5350 = STUN over TLS, 19302-19309 = Google。
# 代价: 网页版 P2P(视频通话/投屏/网页互传)不可用。App 内通话走自己的协议和端口, 不受影响。
