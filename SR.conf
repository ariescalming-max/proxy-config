# ═════════════════════════════════════════════════════════════════
# 用法
#   1. 先在 Shadowrocket 加好机场订阅, 确认能刷出节点(本文件不含节点)
#   2. 文件传到手机: 微信发给自己 / iCloud 云盘 → 在"文件"App 里分享给 Shadowrocket
#   3. 配置页点一下让它带 ✔️
#   4. 首页「全局路由」设成"配置" —— 这步最容易忘, 不设规则不生效
#   5. 首次生效会下载 41 个规则集, 等几秒。jsDelivr 不通的话把所有
#      testingcf.jsdelivr.net/gh/ 换成 raw.githubusercontent.com/ 并去掉 @master
# 排错
#   · 地区分组显示 None: 订阅里没有该地区节点(正常), 或 policy-regex-filter
#     不被你这个版本支持(不正常) —— 后者的话所有地区组都会是 None
#   · 想让分组少一点: 删掉 🇰🇷/🇷🇺/🇮🇳/🇨🇦 这几个用不上的地区行即可
#   · 想省电: 把所有 interval = 300 调成 600
#
# 去广告: 配置文件能做的和不能做的
#   已覆盖(不用额外装东西): 网页广告、App 横幅/插屏、追踪统计 —— 靠上面的
#     Advertising 规则集(781 条), 走 DNS/域名层拦截。
#   做不到: YouTube 片头/中插广告。因为广告和视频本体走同一个域名
#     (googlevideo.com), 广告位是嵌在 youtubei.googleapis.com 的 API 响应里的,
#     只能解密响应用 JS 把 adPlacements / adSlots 字段删掉 —— 这属于"模块"
#     (Shadowrocket → 配置 → 模块 → 加 URL), 需要装并信任 CA 证书, 不能写进配置文件。
#
# 想装的话, 这几个是验证过在维护的(2026-08 时点):
#   YouTube 去广告 + 字幕翻译(需要证书, 我这份配置的 block-quic 是它的前提):
#     https://raw.githubusercontent.com/Maasea/sgmodule/master/YouTube.Enhance.sgmodule
#   广告平台拦截器(其他去广告模块的依赖, 放最上面):
#     https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Module/Kelee/BlockAdvertisers.sgmodule
#   国内 App 开屏广告(按需装, 路径同上目录, 把文件名换掉即可):
#     Taobao_remove_ads / JD_remove_ads / PinDuoDuo_remove_ads / Zhihu_remove_ads
#     RedPaper_remove_ads / Amap_remove_ads / 12306_remove_ads / BaiduNetDisk_remove_ads
#     CoolApk_remove_ads / DiDi_remove_ads / IThome_remove_ads / LuckinCoffee_remove_ads
#     Weixin_Official_Accounts_remove_ads / WexinMiniPrograms_Remove_ads
