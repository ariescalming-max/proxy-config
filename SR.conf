# ══════════ 自动挑选(设一次基本不用动) ══════════
# 正则里的 (?!...) 是排除机场公告节点(剩余流量/套餐到期这类), 免得测速选到它们
♻️ 延迟选优 = url-test, policy-regex-filter = ^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*$, url = http://www.gstatic.com/generate_204, interval = 180, tolerance = 50, timeout = 3
🚑 故障转移 = fallback, policy-regex-filter = ^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*$, url = http://www.gstatic.com/generate_204, interval = 180, timeout = 3

