[rewrite_local]
; 空的。本地重写写在这里, 例如把某个接口的响应替换成空 JSON:
; ^https?://interface\d?\.music\.163\.com/e?api/ad url reject-dict

[rewrite_remote]
; 去广告重写(需要证书, 见文件末尾说明)。想用就把对应行的 ; 去掉:
; 可莉广告过滤器(国内 App 开屏/信息流广告)
; https://kelee.one/Tool/QuantumultX/Rewrite/Remove_ads_by_keli.conf, tag=可莉去广告, update-interval=172800, opt-parser=true, enabled=true
; 奶思去广告合集(网易云/淘宝/京东等, 730 个 App 分文件, 也有合集)
; https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/rewrite.snippet, tag=奶思去广告, update-interval=172800, opt-parser=true, enabled=true

[task_local]
; 流媒体解锁查询(节点页下拉菜单里出现"解锁查询")
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=解锁查询, img-url=checkmark.seal.system, enabled=true

[mitm]
; 空的。装了去广告重写之后, 把它要求的域名填到 hostname 里, 例如:
; hostname = interface.music.163.com, interface3.music.163.com
; 注意: QX 没有小火箭那种 %APPEND% 语法, 多个重写文件的域名要你自己合并成一行。
; 千万不要写 *.apple.com / *.icloud.com / 银行券商域名 —— 它们做了证书固定, 会直接连不上。

#####################################################################
# 用法
#   1. 节点页 → 右上角 + → 订阅, 把机场订阅加进去(配置里故意不含订阅)
#   2. 配置页 → 右上角 + → 填这份配置的链接 → 下载 → 勾选生效
#   3. 首页把模式设成"分流"(不是全局代理/直连)
#   4. 进"策略"页确认 🇯🇵 日本 / 🇸🇬 新加坡 / 🇺🇸 美国 三个组里有节点
#      个别地区空是正常的(你订阅里没那个地区);全部为空说明正则没生效
#
# 要装去广告重写时
#   1. 设置 → MitM → 生成证书 → 安装并在 iOS 设置里信任
#   2. 取消 [rewrite_remote] 里对应那行的注释
#   3. 把该重写要求的域名合并进 [mitm] 的 hostname
#   4. 打开 [general] 里的 udp_drop_list = QUIC(YouTube 去广告必须)
#
# 和另外两端的关系
#   桌面 Clash Verge:D:\Projects\clash-script\Script.js(全局扩展脚本)
#   iOS 小火箭:      D:\Projects\clash-script\Shadowrocket.conf
#   三端分组命名一致, 只是各自平台的语法和限制不同。
#####################################################################




