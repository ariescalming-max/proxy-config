; ══ 工具类 ══════════════════════════════════════════════════════════
; 下面两个的域名都是假的(sub.store / script.hub 不是真网站), 只有你手动在 Safari
; 打开时才产生流量。所以往 [mitm] 加它们的成本≈0, 和加 acs.m.taobao.com 完全不是一回事。
;
; Sub-Store —— 订阅管理器。多个机场订阅合并成一条, 去重、过滤、批量重命名节点。
; 用法: QX 开着, Safari 打开 http://sub.store
; 对这份配置尤其有用: 上面 11 个地区分组全靠节点名的正则匹配, 各家机场命名五花八门,
; 用它把节点统一改成「🇯🇵 日本 01」这种格式之后, 分组才真正稳。
https://raw.githubusercontent.com/sub-store-org/Sub-Store/master/config/QX.snippet, tag=Sub-Store, update-interval=172800, opt-parser=false, enabled=true
; Script Hub —— 在线把 Surge 模块 / 规则集转成 QX 格式(今天手工转 AffiliateMarketing 那件事它能自动做)。
; 用法: QX 开着, Safari 打开 http://script.hub
https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/modules/script-hub.qx.conf, tag=Script Hub, update-interval=172800, opt-parser=false, enabled=true
; BoxJS —— 脚本的配置/cookie 管理面板。只有装了需要存 cookie 的脚本(签到之类)才用得上,
; 现在没装那类脚本, 所以先关着。要用就去掉行首分号, 并把 boxjs.com 加进 [mitm]。
; https://raw.githubusercontent.com/chavyleung/scripts/master/box/rewrite/boxjs.rewrite.quanx.conf, tag=BoxJS, update-interval=172800, opt-parser=false, enabled=true

; ══ 去广告重写(要往 [mitm] 加真实域名, 有代价, 见文件末尾说明)══════════
