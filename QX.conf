#####################################################################
# Aries iOS 分流 · QuantumultX
# 和桌面 Clash / 小火箭那两套同一套分组逻辑, 按 QX 特性重写。
# 节点来自订阅, 本文件不含任何节点或订阅链接(方便公开托管)。
#
# 相比原来那份 yfamilys 的配置, 改了这些:
#   · 规则源换成 GitHub 上可审计的 blackmatrix7/QuantumultX(每日更新, 有提交记录)
#   · tolerance 从 0 改成 50 —— 原来每 600 秒重选, 快 1ms 就切换
#   · DNS 加了 DoH, 去掉明文 8.8.8.8(国内 53 端口被污染, 会拿到假 IP)
#   · 补上 🏠 家宽原生 / 🗾 日本服务 / 📚 学术资源 / 🅿️ PikPak / 🪙 Crypto
#   · 🤖 人工智能 候选里加进日本和家宽(原来只有美/英/德/加)
#   · 国内直连用 QX 内置的 FILTER_REGION + geoip, 不额外拉几万条 IP 表
#   · 分组图标用 Koolson/Qure 图片图标, 和桌面 Clash 视觉统一
#####################################################################

[general]
; 订阅解析必需
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
; 节点测速 / 网络连通性检测
; 两个都用明文 http 是故意的 —— 官方 sample.conf 给的例子也是 http 的 generate_204。
; 测延迟要的是"最小往返", 套一层 TLS 握手反而把测量结果搅浑。
server_check_url = http://cp.cloudflare.com/generate_204
; 5000 而不是 3000: 这个超时包含 DNS + TCP + TLS + HTTP 全流程, 移动网络下
; 3 秒容易把还能用的节点误判成挂了。官方示例给的也是 5000。
server_check_timeout = 5000
network_check_url = http://www.baidu.com
; 点节点右侧 ⓘ 时查落地信息
geo_location_checker = http://ip-api.com/json/?fields=8450015&lang=zh-CN, https://raw.githubusercontent.com/deezertidal/QuantumultX-Rewrite/master/rewrite/ip-api.js
profile_img_url = https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
; 不进代理的地址段
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32
; 这些域名不做 DNS 处理: 运营商一键登录、部分银行 App 会因为被接管而失败
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
; 节点不支持 UDP 时直接拒绝, 比卡住等超时好
fallback_udp_policy = reject
icmp_auto_reply = true
; 装 YouTube 去广告重写时再打开下面这行:
; YouTube 默认走 QUIC(UDP 443), 不挡掉的话 MITM 看不到流量, 重写不生效。
; 但注意这是全局丢弃 QUIC, 不只影响 YouTube —— Telegram 语音通话、部分游戏、
; 走 HTTP/3 的网站都会退回 TCP, 弱网下体感可能变差。不装 YouTube 重写就别开。
; udp_drop_list = QUIC

[dns]
; no-ipv6: 让 AAAA 查询直接失败, 只走 A 记录。国内网络这样更省事、少一类抽风。
; 注意: 到了日本用 IPv6-only 的 Wi-Fi 或 NAT64 网络时, 这行可能导致连不上 ——
; 那种环境靠 DNS64 合成 AAAA, 被这行掐掉就没地址了。到日本先把这行注释掉试试。
no-ipv6
; 三个国内 DoH 并发查询。为什么不是"DoH + 明文 DNS 兜底":
; 官方 sample.conf 写明 —— "When doh-server or doq-server is set, system and all other
; non-encrypted regular servers will be ignored"。也就是说只要设了 doh-server,
; 下面那两行明文 server 根本不会被使用, 写了也是死代码, 所以注释掉了。
; 真正的冗余靠并发多个 DoH: 三家同时查, 谁先回用谁, 一家挂了不影响。
; (iOS 15 以下最多只支持 2 个 doh-server, 你是 iPhone 15 Pro 不受这个限制)
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://doh.360.cn/dns-query
; 下面两行只在你把上面 doh-server 整行注释掉之后才有意义:
; server = 223.5.5.5
; server = 119.29.29.29

[policy]
; ══════════ 总控 ══════════
static = 🔰 模式选择, ♻️ 延迟选优, 🚑 故障转移, 🏠 家宽原生, ⚙️ 节点选择, 🇭🇰 香港, 🇨🇳 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇰🇷 韩国, 🇺🇸 美国, 🇬🇧 英国, 🇩🇪 德国, 🇨🇦 加拿大, 🇷🇺 俄罗斯, 🇮🇳 印度, 🌐 其他地区, 🔗 全局直连, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
static = ⚙️ 节点选择, server-tag-regex=^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*$, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
url-latency-benchmark = ♻️ 延迟选优, server-tag-regex=^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*$, check-interval=180, tolerance=50, alive-checking=false, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
; 下面两个 available 组带的 check-interval / alive-checking, 官方 sample.conf 只在
; url-latency-benchmark 那一行示范过, 没写 available 也吃这两个参数。所以别指望它们
; 真的每 180 / 300 秒后台巡检一轮 —— available 的确定语义是"策略被用到时, 依次挑
; 第一个可用的节点"。参数留着不碍事, 但注释不能按"定时巡检"来理解。
available = 🚑 故障转移, server-tag-regex=^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*$, check-interval=180, alive-checking=true, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png
available = 🏠 家宽原生, server-tag-regex=^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*(家宽|家庭宽带|原生|住宅|[Ii][Ss][Pp]|[Hh]ome|[Rr]esidential|[Bb]roadband|[Nn]ative), check-interval=300, alive-checking=true, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

; ══════════ AI ══════════
; 第一个候选是 static 组的默认值。「家宽原生」靠正则匹配, 免费机场大多没有家宽节点,
; 放第一位会让 AI 默认指向一个空组、直接连不上(static 不会自动跳到下一个)。
; 所以默认给日本, 家宽放第二位 —— 你订阅里真有家宽节点就手动切过去, AI 服务对住宅 IP 更友好。
static = 🤖 人工智能, 🇯🇵 日本, 🏠 家宽原生, 🇺🇸 美国, 🇸🇬 新加坡, 🇨🇳 台湾, 🇩🇪 德国, 🔰 模式选择, ⚙️ 节点选择, 🔗 全局直连, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png

