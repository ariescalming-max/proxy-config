[mitm]
; 装了去广告重写之后, 把它要求的域名合并进下面这行 hostname:
hostname = acs.m.taobao.com, amdc.m.taobao.com, p0.pipi.cn, interface.music.163.com, interface?.music.163.com, ipv4.music.163.com, sub.store, script.hub, *.script.hub
; 前三个是大麦和猫眼的重写要求的(真实域名, 有代价)。
; 中间三个是网易云去广告要的 —— 只解密 interface*/ipv4 这两类接口域名,
; music.163.com 本体、图片/音频 CDN(*.music.126.net 之类)都没进来, 别顺手加宽。
; 最后三个是 Sub-Store 和 Script Hub —— 假域名, 只有你手动在 Safari 打开时才有流量, 成本≈0。
; 上面三个域名对应大麦和猫眼的重写。acs.m.taobao.com 是阿里公共网关(淘宝/闲鱼也走它),
; 如果加了之后淘宝或闲鱼出问题, 先把 acs.m.taobao.com 删掉再试。
; 注意: QX 没有小火箭那种 %APPEND% 语法, 多个重写文件的域名要你自己合并成一行。
; 千万不要写 *.apple.com / *.icloud.com / 银行券商域名 —— 它们做了证书固定, 会直接连不上。

#####################################################################
# 用法
#   1. 节点页 → 右上角 + → 订阅, 把机场订阅加进去(配置里故意不含订阅)
#   2. 配置页 → 右上角 + → 填这份配置的链接 → 下载 → 勾选生效
#   3. 首页把模式设成"分流"(不是全局代理/直连)
#   4. 进"策略"页确认 🇯🇵 日本 / 🇸🇬 新加坡 / 🇺🇸 美国 三个组里有节点
#      个别地区空是正常的(你订阅里没那个地区);全部为空说明正则没生效
#
# 要装去广告重写时
#   1. 证书装好即可(QX 装 App 时一次性的事), 关键是下面第 3 步的解密域名
#   2. 取消 [rewrite_remote] 里对应那行的注释
#   3. 把该重写要求的域名合并进 [mitm] 的 hostname
#   4. 打开 [general] 里的 udp_drop_list = QUIC(YouTube 去广告必须)
#
# ⚠️ 重新下载这份配置会把 MITM 证书冲掉
#   QX 把 CA 证书(ca-p12 / ca-passphrase)存在配置文件的 [mitm] 段里。这份配置是公开
#   托管的, 绝对不能带私钥, 所以里面只有 hostname 一行 —— 于是每次"下载配置"都会把
#   本机那两行覆盖掉, 证书随之失效。表现是: 重写规则还在, 但一条都不生效, 而且不报错。
#   所以每次更新完配置, 先确认这一件事:
#     QX → 设置 → MITM → 看证书还在不在; 不在就重新生成 + 到 iOS 设置里信任
#   (或者更新前先把本机 [mitm] 段里的 ca-p12 / ca-passphrase 两行抄下来, 更新后贴回去 ——
#    贴回去比重新生成省事: 重新生成是新 CA, iOS 那边要重新装一遍描述文件)
#   判断"重写到底有没有在工作": 大麦开屏还有广告 = 证书那步没成。
#
# 微信支付 / 美团 / 京东 出问题时怀疑 HTTPDNS 拦截
#   这些 App 的 HTTPDNS 接口(dns.weixin.qq.com、paydns.wechatpay.cn、httpdns.meituan.com
#   等)在拦截名单里。它们只是「加速用」的旁路解析, App 都实现了系统 DNS 回退,
#   正常情况下感觉不到。但万一遇到付款卡住 / 登录转圈 / 推送不到:
#   1. 搜「HTTPDNS 拦截开关」, 会找到两处(一处在 [filter_local], 一处在 [rewrite_local])
#   2. 把两段的规则行全部加上行首分号, 重新下载配置, 再试
#   3. 好了就是这个原因, 没好就是别的, 把分号去掉还原
#   注意必须两段一起关 —— 只关一段, IP 形式的 HTTPDNS 接口还是被拦着, 测不准。
#   没做成可切换的策略组, 是因为 [rewrite_local] 的 url reject 不能指向策略组,
#   做出来的开关只能管住一半, 反而会得出错误结论。
#
# 两个工具怎么用
#   Sub-Store   QX 开着 → Safari 打开 http://sub.store
#               把几个机场订阅都加进去 → 合并成一条 → 批量重命名 → 输出一条订阅链接
#               然后 QX 里只留那一条订阅。地区分组从此不再受各家乱命名影响。
#   Script Hub  QX 开着 → Safari 打开 http://script.hub
#               贴 Surge 模块 / 规则集的链接, 它输出 QX 格式, 省得手工转
#   两个都要证书装好(它们靠 MITM 假域名工作), 但不吃流量、不发热。
#
# 和另外两端的关系
#   桌面 Clash Verge 用全局扩展脚本, iOS 另一台用小火箭配置。
#   三端分组命名一致, 只是各自平台的语法和限制不同。(本地路径不写进公开文件)
#####################################################################
