; ══════════ 地区分组 ══════════════════════════════════════════════
; url-latency-benchmark = 每 check-interval(300 秒)重测一轮延迟, 选该地区最快的。
; tolerance=50: 新节点要快 50ms 以上才换, 免得为 1ms 的差距来回跳。
; alive-checking=false 是为了省电 —— 只在重测那一刻探测, 不做额外的存活巡检。
; 代价说清楚: 节点中途挂掉不会立刻切走, 最长要等到下一轮重测(≤300 秒)。
;   受不了这个延迟 → 把 alive-checking 改成 true, 换来的是更耗电 + 更多测速流量。
;   想立刻换 → 手动切到「🚑 故障转移」, 那个组的语义就是"挑一个当下能用的"。
url-latency-benchmark = 🇭🇰 香港, server-tag-regex=^(?!.*(剩余|到期|过期|重置|官网|客服|通知|失联|发布|网址|导航|订阅|续费|试用|邀请|加群|群组|[Ee]xpire|[Rr]eset|[Rr]enew|[Ww]ebsite|[Ss]ponsor|[Ii]nvite)).*(🇭🇰|香港|港區|港区|深港|沪港|(^|[^A-Za-z0-9])[Hh][Kk]([^A-Za-z]|$)|[Hh]ong ?[Kk]ong), check-interval=300, tolerance=50, alive-checking=false, img-url=https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/HK.png
